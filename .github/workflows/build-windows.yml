name: Build Windows portable ZIP

on:
  workflow_dispatch:
  # Trial builds: packaging changes only; upstream source updates do not trigger builds.
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'packaging/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test portable ZIP
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Upload tested ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: output/crazywaterworld-win-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
